app_id: nimi.odd-bureau
display_name: 奇物局
version: 0.1.0
profile: standalone
manifest_role: submitted-input
app_access:
  - runtime.consume
capability_contract_refs:
  - text.generate
  - vision.locate
  - image.generate
  - video.generate
  - music.generate
  - audio.synthesize
  - audio.transcribe
  - voice.create
required_standardized_feature_refs: []
storage_policy:
  kind: nimi-mediated-default
metadata:
  summary: 把照片里的物件变成有性格的角色，调查奇物谜案、编排音乐机关和一场物件戏剧。
  icon: assets/app-icon.png
  readme: APP_GUIDE.md
  release_notes: RELEASE_NOTES.md
  author: Nimi Team
  homepage_url: https://github.com/nimiplatform/nimiapp-odd-bureau
  support_url: https://github.com/nimiplatform/nimiapp-odd-bureau/issues
local_development:
  electron:
    renderer_origin: http://127.0.0.1:1485
safety_profile:
  intended_audience: general
  content_descriptors: []
  ai:
    direct_interaction: true
    interaction_notice: present
    risk_features: []
    subject_notice: not-applicable
    outputs:
      - modality: text
        exposure: in-app-only
        publication_control: not-applicable
        in_product_notice: absent
        export_visible_marking: not-applicable
        machine_readable_marking: absent
      - modality: audio
        exposure: in-app-only
        publication_control: not-applicable
        in_product_notice: absent
        export_visible_marking: not-applicable
        machine_readable_marking: absent
  data_practices:
    publisher_direct_external_network: false
    telemetry: []
    third_party_account: none
    user_content_sharing: none
    commercial_features: []
    sensitive_data_categories: []
  high_impact_decision_uses: []
