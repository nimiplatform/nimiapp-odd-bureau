build_profile_ref: electron-packager-pnpm-vite
test_command: pnpm run test:app
build_command: pnpm run build:electron:production
output_path: dist-electron-package
lockfile_path: pnpm-lock.yaml
lockfile_policy: author-install-generates-lockfile
ci_install_command: pnpm install --frozen-lockfile
targets:
  windows-x86_64:
    os: windows
    arch: x86_64
    build_command: pnpm run build:electron:production
    payload_path: dist-electron-package/nimiplatform-odd-bureau-shell-win32-x64
    runtime_entry: payload/nimiplatform-odd-bureau-shell.exe
  macos-aarch64:
    os: macos
    arch: arm64
    build_command: pnpm run build:electron:production
    payload_path: dist-electron-package/nimiplatform-odd-bureau-shell-darwin-arm64
    runtime_entry: payload/nimiplatform-odd-bureau-shell.app/Contents/MacOS/nimiplatform-odd-bureau-shell
profile_role: developer-workflow-input
